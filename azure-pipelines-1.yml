trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:name: practicesoftwaretestingDevOps

on:
  push:
    branches:
      - main
      - ft/pipeline
  pull_request:
    branches:
      - main
      - ft/pipeline
  merge_group:
    branches:
      - main
      - ft/pipeline

jobs:
  build:
    name: Build & Test Maven Project
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache Playwright Browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Build Project & Run Tests
        run: mvn clean test

  auto-create-pr:
    name: Auto-Create Pull Request
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          base: main
          title: "Auto PR from ${{ github.ref_name }}"
          body: "This PR was automatically created by GitHub Actions after successful CI."
- task: Maven@3
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean install'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
  displayName: 'Build and Test with Maven'
