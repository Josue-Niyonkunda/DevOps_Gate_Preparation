name: practicesoftwaretestingDevOps

on:
  push:
    branches: [ main, ft/pipeline ]
  pull_request:
    branches: [ main, ft/pipeline ]
  merge_group:
    branches: [ main, ft/pipeline ]

jobs:

  build:
    name: build maven project
    runs-on: windows-latest

    steps:
      - name: checkout codes
        uses: actions/checkout@v4

      - name: setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: build and test
        run: mvn clean test

  auto-create-pr:
    name: Auto Create PR
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    needs: build
    runs-on: windows-latest

    steps:
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          base: main
          title: "Auto PR from ${{ github.ref_name }}"
          body: "This PR was automatically created by GitHub Actions after successful CI."
